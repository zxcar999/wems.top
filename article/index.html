<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>wems.top</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
        body {
            background-color: #f1f1f1;
        }
        .menu{
            display: flex;
            flex-direction: row;
            justify-content: start;
            background-color: #ffffff;
            width: 100%;
            height: 50px;
            padding: 0px;
            border-radius: 30px;
        }
        .title{
            padding: 7px;
            padding-left: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        .arttitle{
            padding: 7px;
            padding-left: 20px;
            font-size: 30px;
            font-weight: bold;
        }
        .menuLabel{
            padding: 13px;
            font-size: 15px;
        }
        .main{
            display: flex;
            flex-direction: row;
            justify-content: start;
            width: 100%;
            height: auto;
        }
        .news{
            display: flex;
            flex-direction: column;
            justify-content: start;
            width: 25%;
            background-color: #ffffff;
            height: auto;
            margin: 20px;
            border-radius: 30px;
        }
        .articlelist{
            display: flex;
            flex-direction: column;
            justify-content: start;
            width: 95%;
            background-color: #ffffff;
            height: auto;
            margin: 20px;
            border-radius: 30px;
        }
        .article p {
            margin: 0;
            line-height: 1.6;
            word-wrap: break-word;
            width: 100%;
        }
        .articlemain{
            display: flex;
            flex-direction: column;
            justify-content: start;
            width: 95%;
            background-color: #f0f0f0;
            height: auto;
            margin: 20px;
            border-radius: 30px;
            white-space: pre-line;
            padding: 10px;
        }
        .articletitlecolumn{
            height: auto;
            width: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .custom-hr {
            border: 0;              /* 移除默认边框 */
            height: 1px;            /* 分割线高度 */
            background: linear-gradient(to right, transparent, #333, transparent); /* 渐变效果 */
            margin: 5px 0;         /* 上下边距 */
        }
        .created_at{
            padding-left: 20px;
        }

    </style>
</head>
<body>
<div class="menu">
    <label class="title">wems.top</label>
    <label class="menuLabel" onclick="jmpToHome()">首页</label>
    <label class="menuLabel" onclick="jmpToArticle(-1)">文章</label>
</div>
<div class="main">
    <div id="articlelist" class="articlelist">
        <div id="articletitlecolumn" class="articletitlerow">
            <p class="arttitle">{{title}}</p>
            <p class="created_at">{{created_at}}</p>
        </div>
        <hr class="custom-hr">
        <div id="articlemain" class="articlelist">
            <p class="articlemain">{{content}}</p>
        </div>
    </div>
</div>
</body>
<script>
    function jmpToHome(){
        window.location.href = "./";
    }
    function jmpToArticle(id){
        if(id==-1){
            window.location.href = "./article";
        }else{
            window.location.href = "./article?id="+id;
        }
    }
</script>
