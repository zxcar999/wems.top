
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>wems.top</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
        body {
            background-color: #f1f1f1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .menu{
            display: flex;
            flex-direction: row;
            justify-content: start;
            background-color: #ffffff;
            width: 100%;
            height: 50px;
            padding: 0px;
            border-radius: 30px;
        }
        .title{
            padding: 7px;
            padding-left: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        .menuLabel{
            padding: 13px;
            font-size: 15px;
        }
        .main{
            display: flex;
            flex-direction: row;
            justify-content: start;
            width: 100%;
            height: auto;
            margin-bottom: auto;
            padding-top: 10px;
        }
        .news{
            display: flex;
            flex-direction: column;
            justify-content: start;
            width: 25%;
            background-color: #ffffff;
            height: auto;
            margin: 20px;
            border-radius: 30px;
            padding: 10px;
        }
        .articlelist{
            display: flex;
            flex-direction: column;
            justify-content: start;
            width: 75%;
            background-color: #ffffff;
            height: auto;
            margin: 20px;
            border-radius: 30px;
        }
        .article{
            /*display: flex;
            flex-direction: column;
            */
            justify-content: start;
            width: 95%;
            background-color: #ffffff;
            height: auto;
            padding: 10px;
            border-radius: 30px;
        }
        .article button {
            margin: 0;
            line-height: 1.6;
            word-wrap: break-word;
            width: 100%;
            background-color: white;
            border-width: 0;
            font-size: 20px;
        }
        .article button:hover{
            margin: 0;
            line-height: 1.6;
            word-wrap: break-word;
            width: 100%;
            color: cornflowerblue;
        }
        .custom-hr {
            border: 0;              /* 移除默认边框 */
            height: 1px;            /* 分割线高度 */
            background: linear-gradient(to right, transparent, #333, transparent); /* 渐变效果 */
            margin: 5px 0;         /* 上下边距 */
        }
        .beian{
            justify-self: center;
            margin-top: auto;
            padding-right: 20px;
        }
        .beianrow{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <label class="title">wems.top</label>
        <label class="menuLabel" onclick="jmpToHome()">首页</label>
        <label class="menuLabel" onclick="jmpToArticle(-1)">文章</label>
    </div>
    <div class="main">
        <div class="news">
            <label>News:Wems.top正式自研</label>
        </div>
        <div id="articlelist" class="articlelist">

        </div>
    </div>
    <div class="beianrow">
        <a href="https://github.com/zxcar999/wems.top" class="beian">github仓库</a>
        <a href="https://beian.miit.gov.cn" class="beian">浙ICP备2026001155号-1</a>
    </div>
</body>
<script>
    function jmpToHome(){
        window.location.href = "./";
    }
    function jmpToArticle(id){
        if(id==-1){
            window.location.href = "./article";
        }else{
            window.location.href = "./article?id="+id;
        }
    }
</script>
<script>
    //onPageshow加载内容
    let articleNum;
    fetch('api/articleNum')
        .then(res => res.text())
        .then(articleN=>{
            articleNum=articleN;
            //console.log("N:"+articleN);
            let arthtml='';
            let cnt=0;
            for(let i=1;i<=articleNum;i++){
                fetch('api/articleTitle?id='+i)
                    .then(res => res.json())
                    .then(articleMain=>{
                        arthtml+=`<div class="article"><button class="title" onclick="jmpToArticle(${articleMain.id})">${articleMain.title}</button><hr class="custom-hr"></div>`;
                        //console.log(articleMain);
                        cnt++;
                        if(cnt==articleNum){
                            document.getElementById('articlelist').innerHTML=arthtml;
                        }
                    })
                    .catch(err=>{
                        arthtml+=`<div class="article"><p>${err}</p></div>`;
                        cnt++;
                    })
            }
        })
        .catch(err => {
            document.getElementById('articles').innerHTML = `<label>${err}</label>`;
        })


</script>
</html>
